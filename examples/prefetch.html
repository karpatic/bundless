<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bundless Prefetch Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bundless declarative prefetch demo">
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@17.0.2/es2022/react.mjs",
        "react-dom": "https://esm.sh/react-dom@17.0.2/es2022/react-dom.mjs"
      }
    }
  </script>
  <script type="application/json" data-bundless-prefetch>
    [
      "/test/components/TextInput.jsx"
    ]
  </script>
</head>
<body>
  <div id="react-root"></div>

  <script src="https://esm.sh/react@17.0.2/es2022/react.mjs" type="module"></script>
  <script src="https://esm.sh/react-dom@17.0.2/es2022/react-dom.mjs" type="module"></script>
  <script type="text/babel">
    import React from "react";
    import { render } from "react-dom";

    function App() {
      const [TextInput, setTextInput] = React.useState(null);
      const [text, setText] = React.useState("");
      const [status, setStatus] = React.useState("Prefetch declared. Waiting before dynamic import...");

      React.useEffect(() => {
        const timer = setTimeout(() => {
          setStatus("Calling window.import('/test/components/TextInput.jsx')...");
          window.import("/test/components/TextInput.jsx")
            .then((module) => {
              setTextInput(() => module.default);
              setStatus("Dynamic module loaded.");
            })
            .catch((error) => {
              setStatus(`Import failed: ${error.message}`);
            });
        }, 800);

        return () => clearTimeout(timer);
      }, []);

      return (
        <main>
          <h1>Bundless Prefetch Demo</h1>
          <p>{status}</p>
          {TextInput ? (
            <TextInput text={text} onChange={setText} />
          ) : (
            <p>The prefetched TextInput module has not been evaluated yet.</p>
          )}
        </main>
      );
    }

    render(<App />, document.getElementById("react-root"));
  </script>
  <script src="/dist/bundless.acorn.min.js" type="module"></script>
</body>
</html>
