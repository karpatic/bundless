<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bundless React 18 createRoot demo</title>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1/es2022/react.mjs",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/es2022/client.mjs?external=react"
      }
    }
  </script>
</head>
<body>
  <div id="react-root"></div>
  <script type="text/jsx">
    import React from "react";
    import { createRoot } from "react-dom/client";

    function App() {
      return <h1 id="react18-result">React 18 createRoot works.</h1>;
    }

    createRoot(document.getElementById("react-root")).render(<App />);
  </script>
  <script src="/dist/bundless.acorn.min.js" type="module"></script>
