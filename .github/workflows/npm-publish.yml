name: npm Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read package metadata
        id: package
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const owner = (process.env.GITHUB_REPOSITORY_OWNER || '').toLowerCase();
          const refName = process.env.GITHUB_EVENT_RELEASE_TAG_NAME || process.env.GITHUB_REF_NAME || '';
          const outputPath = process.env.GITHUB_OUTPUT;
          const lines = [
            `name=${pkg.name}`,
            `version=${pkg.version}`,
            `tag=${refName}`,
            `github_name=@${owner}/${pkg.name}`,
          ];
          fs.appendFileSync(outputPath, `${lines.join('\n')}\n`);
          NODE
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Validate tag version
        run: |
          test "v${{ steps.package.outputs.version }}" = "${{ steps.package.outputs.tag }}"

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Check if npm version already exists
        id: npm_version
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm via trusted publisher
        if: steps.npm_version.outputs.should_publish == 'true'
        run: npm publish --provenance --access public

      - name: Prepare GitHub Packages workspace
        run: |
          rm -rf .github-package
          mkdir -p .github-package
          cp -R dist .github-package/dist
          cp README.MD .github-package/README.MD
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const scopedName = process.env.GITHUB_PACKAGE_NAME;
          const githubPkg = {
            ...pkg,
            name: scopedName,
            publishConfig: {
              registry: 'https://npm.pkg.github.com'
            }
          };
          fs.writeFileSync('.github-package/package.json', `${JSON.stringify(githubPkg, null, 2)}\n`);
          NODE
        env:
          GITHUB_PACKAGE_NAME: ${{ steps.package.outputs.github_name }}

      - name: Verify GitHub package contents
        working-directory: .github-package
        run: npm pack --dry-run

      - name: Check if GitHub Packages version already exists
        id: github_version
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          if npm view "${{ steps.package.outputs.github_name }}@${{ steps.package.outputs.version }}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.github_version.outputs.should_publish == 'true'
        working-directory: .github-package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --registry https://npm.pkg.github.com