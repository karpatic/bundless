name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      release_tag: ${{ steps.package.outputs.tag }}
      is_tag_push: ${{ steps.package.outputs.is_tag_push }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release bundles
        run: npm run release:build

      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p \"require('./package.json').name\")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "is_tag_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag version
        if: github.ref_type == 'tag'
        run: |
          test "v${{ steps.package.outputs.version }}" = "${{ steps.package.outputs.tag }}"

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', steps.package.outputs.version) }}
          generate_release_notes: true
          files: |
            dist/*.js
            dist/*.br

  npm-publish:
    needs: release
    if: secrets.NPM_TOKEN != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release bundles
        run: npm run release:build

      - name: Validate published version for tag pushes
        if: needs.release.outputs.is_tag_push == 'true'
        run: |
          test "v$(node -p \"require('./package.json').version\")" = "${GITHUB_REF_NAME}"

      - name: Check if npm version already exists
        id: npm_version
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_version.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}