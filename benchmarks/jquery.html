<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>jQuery counter benchmark</title>
  <script src="./ready.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
  <main id="benchmark-app">
    <h1>Counter</h1>
    <button data-counter type="button">Count: 0</button>
  </main>
  <script>
    $(function () {
      $("[data-counter]").on("click", function () {
        const count = Number($(this).text().split(": ")[1]) + 1;
        $(this).text(`Count: ${count}`);
      });
      benchmarkReady("#benchmark-app", "counter");
    });
  </script>
</body>
</html>
