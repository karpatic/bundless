<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>React and Babel counter benchmark</title>
  <script src="./ready.js"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="benchmark-app"></div>
  <script type="text/babel">
    function Counter() {
      const [count, setCount] = React.useState(0);
      React.useEffect(() => benchmarkReady("#benchmark-app", "counter"), []);
      return (
        <main>
          <h1>Counter</h1>
          <button data-counter type="button" onClick={() => setCount(count + 1)}>Count: {count}</button>
        </main>
      );
    }

    ReactDOM.render(<Counter />, document.getElementById("benchmark-app"));
  </script>
</body>
</html>
