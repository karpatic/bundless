<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTMX counter benchmark</title>
  <script src="./ready.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.6"></script>
</head>
<body>
  <main id="benchmark-app">
    <h1>Counter</h1>
    <button data-counter type="button" hx-on:click="this.textContent = 'Count: ' + (Number(this.textContent.split(': ')[1]) + 1)">Count: 0</button>
  </main>
  <script>benchmarkReady("#benchmark-app", "counter");</script>
</body>
</html>
