<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Bootstrap Standalone</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <!-- <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> -->
    <script src="/src/bundless.sucrase.js" type="module"></script>   

    <!-- React-Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/react-bootstrap@next/dist/react-bootstrap.min.js" crossorigin></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Button, Container, Row, Col, Card } = ReactBootstrap;

        function App() {
            return (
                <Container className="mt-5">
                    <Row>
                        <Col>
                            <Card>
                                <Card.Body>
                                    <Card.Title>Welcome to React-Bootstrap</Card.Title>
                                    <Card.Text>
                                        This is a simple example using React with Bootstrap in standalone mode.
                                    </Card.Text>
                                    <Button variant="primary">Click me</Button>
                                </Card.Body>
                            </Card>
                        </Col>
                    </Row>
                </Container>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
